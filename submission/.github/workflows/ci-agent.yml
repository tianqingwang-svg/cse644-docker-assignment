name: Agent-Optimized CI Pipeline

on:
  push:
    branches: ["*"]
  pull_request:

jobs:
  smart-test:
    name: Smart Test Execution (Impact Analysis)
    runs-on: ubuntu-latest
    outputs:
      build_failed: ${{ steps.test_step.outcome == 'failure' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest anthropic PyGithub requests

      - id: test_step
        name: Run Selected Tests
        run: |
          python scripts/select_tests.py 2>&1 | tee build_log.txt
        continue-on-error: true  # Allow pipeline to proceed to agent remediation

      - name: Upload Build Log Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt

  agent-remediate:
    name: Auto-Remediation Agent (PR Gate)
    needs: smart-test
    if: needs.smart-test.outputs.build_failed == 'true'
    runs-on: ubuntu-latest
    environment: agent-proposed  # Mandatory Human Approval Gate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: build-log

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Agent Dependencies
        run: pip install anthropic PyGithub requests

      - name: Execute Remediation Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/remediation_agent.py
